plugins { id 'com.android.library' }
android {
    namespace 'local.certiva.qvac'
    compileSdk 35
    defaultConfig { minSdk 33; ndk { abiFilters 'arm64-v8a' } }
    sourceSets.main {
        assets.srcDirs '.generated/assets'
        jniLibs.srcDirs '.generated/jniLibs', 'vendor/android/bare-kit/jni'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { api files('vendor/android/bare-kit/classes.jar') }
